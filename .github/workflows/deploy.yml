name: LMS CI/CD Pipeline

on:
  push:
    branches:
      - upgrade/phase1-error-fixing
  pull_request:
    branches:
      - upgrade/phase1-error-fixing
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Run Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Backend Integration & Unit Tests (Isolated H2 DB)
        run: mvn -f backend/pom.xml test

      - name: Package Backend Artifact (Pre-deploy Verification)
        run: mvn -f backend/pom.xml package -DskipTests

      - name: Set up Node.js for Frontend Validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Frontend JavaScript Syntax
        run: |
          echo "Validating syntax across all frontend JavaScript files..."
          for file in frontend/js/*.js; do
            if [ -f "$file" ]; then
              node --check "$file"
              echo "  [OK] $file"
            fi
          done

      - name: Validate Critical Frontend Static Assets
        run: |
          echo "Verifying presence of critical frontend pages and configurations..."
          required_files=(
            "frontend/index.html"
            "frontend/js/config.js"
            "frontend/netlify.toml"
            "frontend/pages/login.html"
            "frontend/pages/register.html"
            "frontend/admin/dashboard.html"
            "frontend/teacher/dashboard.html"
            "frontend/student/dashboard.html"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file missing: $file"
              exit 1
            fi
            echo "  [OK] Found $file"
          done

  deploy-backend:
    name: Deploy Backend to Render
    needs: test-and-verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set in repository settings."
            exit 1
          fi
          echo "Triggering Render deployment for branch: ${{ github.ref_name }}..."
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Render response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Render deploy hook triggered successfully (HTTP $http_code)."
          else
            echo "::error::Render deploy hook failed with HTTP $http_code: $body"
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend to Netlify
    needs: [test-and-verify, deploy-backend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Build Hook
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK_URL }}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK_URL secret is not set in repository settings."
            exit 1
          fi
          echo "Triggering Netlify deployment..."
          response=$(curl -s -w "\n%{http_code}" -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK_URL }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Netlify response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Netlify build hook triggered successfully (HTTP $http_code)."
          else
            echo "::error::Netlify build hook failed with HTTP $http_code: $body"
            exit 1
          fi

  verify-and-report:
    name: Verify Deployment & Generate Report
    needs: [deploy-backend, deploy-frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Services to Initialize
        run: |
          echo "Waiting 30 seconds for cloud deploy triggers to initialize..."
          sleep 30

      - name: Check Backend Health
        id: health_check
        run: |
          echo "Checking backend health at https://lms-backend-qkfy.onrender.com/api/health..."
          for i in {1..6}; do
            response=$(curl -s -w "\n%{http_code}" --max-time 15 "https://lms-backend-qkfy.onrender.com/api/health" || true)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "Attempt $i: HTTP $http_code - Response: $body"
            if [ "$http_code" = "200" ]; then
              echo "Backend is HEALTHY (UP)."
              echo "backend_status=HEALTHY" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Backend not ready yet, waiting 15s..."
            sleep 15
          done
          echo "Backend is still deploying or waking up from cold start."
          echo "backend_status=DEPLOYING_OR_COLD_START" >> $GITHUB_OUTPUT

      - name: Check Frontend Reachability
        id: frontend_check
        run: |
          echo "Checking Netlify frontend reachability..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://smart-learning-management-system.netlify.app" || true)
          echo "Frontend HTTP status: $http_code"
          if [ "$http_code" = "200" ]; then
            echo "frontend_status=REACHABLE" >> $GITHUB_OUTPUT
          else
            echo "frontend_status=UNAVAILABLE" >> $GITHUB_OUTPUT
          fi

      - name: Publish Deployment Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # Galgotias LMS — Deployment Pipeline Summary

          | Service | Target URL | Deployment Status |
          |---|---|---|
          | **Branch** | `${{ github.ref_name }}` | Commit `${{ github.sha }}` |
          | **Backend (Render)** | [lms-backend-qkfy.onrender.com](https://lms-backend-qkfy.onrender.com/api/health) | Triggered via Deploy Hook |
          | **Frontend (Netlify)** | [smart-learning-management-system.netlify.app](https://smart-learning-management-system.netlify.app) | Triggered via Build Hook |
          | **Backend Health** | `/api/health` | `${{ steps.health_check.outputs.backend_status }}` |
          | **Frontend Status** | CDN Root | `${{ steps.frontend_check.outputs.frontend_status }}` |

          ### Verification Note
          Render free-tier instances may take 45-60 seconds to finish restarting or waking up from idle mode.
          EOF

