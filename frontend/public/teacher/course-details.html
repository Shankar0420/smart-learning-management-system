<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curriculum Management - Teacher Portal</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <div id="sidebar-container"></div>

      <div class="dashboard-main">
        <div id="header-container">
          <span id="page-title-text" class="hidden">Curriculum Manager</span>
        </div>

        <main class="dashboard-content">
          <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: 1.5rem;">
            <div>
              <a href="/teacher/courses.html" class="text-muted" style="font-size: 0.85rem;">← Back to My Courses</a>
              <h2 id="teacher-course-title" style="font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-top: 0.25rem;">
                Course Curriculum
              </h2>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 flex-wrap">
              <button class="btn btn-primary btn-sm" onclick="openModuleModal()">
                + Add Module
              </button>
              <a id="btn-manage-quizzes" href="#" class="btn btn-secondary btn-sm">
                📝 Manage Quizzes
              </a>
              <a id="btn-manage-assignments" href="#" class="btn btn-secondary btn-sm">
                📂 Manage Assignments
              </a>
            </div>
          </div>

          <div id="curriculum-error-area" class="alert alert-danger hidden"></div>

          <!-- Modules and Lessons Tree -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Syllabus Modules & Lessons</h3>
              <span class="badge badge-info" id="modules-count-badge">0 Modules</span>
            </div>
            <div class="card-body" id="curriculum-container">
              <div class="loading-container">
                <div class="spinner-primary"></div>
                <p>Loading modules and lessons from MariaDB...</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Module Create/Edit Modal -->
    <div class="modal-overlay" id="module-modal">
      <div class="modal-container">
        <div class="modal-header">
          <h3 class="modal-title" id="module-modal-title">Add Course Module</h3>
          <button class="modal-close" onclick="window.common.closeModal('module-modal')">&times;</button>
        </div>
        <form id="module-form">
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label required" for="module-title-input">Module Title</label>
              <input
                type="text"
                id="module-title-input"
                class="form-input"
                placeholder="e.g. Module 1: Introduction to Java Virtual Machine"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="window.common.closeModal('module-modal')">Cancel</button>
            <button type="submit" id="save-module-btn" class="btn btn-primary">Save Module</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lesson Create/Edit Modal -->
    <div class="modal-overlay" id="lesson-modal">
      <div class="modal-container" style="max-width: 640px;">
        <div class="modal-header">
          <h3 class="modal-title" id="lesson-modal-title">Add Lesson</h3>
          <button class="modal-close" onclick="window.common.closeModal('lesson-modal')">&times;</button>
        </div>
        <form id="lesson-form">
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label required" for="lesson-title-input">Lesson Title</label>
              <input
                type="text"
                id="lesson-title-input"
                class="form-input"
                placeholder="e.g. ClassLoaders, Memory Areas, and Execution Engine"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label required" for="lesson-content-input">Lesson Content</label>
              <textarea
                id="lesson-content-input"
                class="form-textarea"
                rows="8"
                placeholder="Enter comprehensive educational lecture notes, code samples, and conceptual guidelines..."
                required
              ></textarea>
              <p class="form-help">Clean text editor for student readability.</p>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="window.common.closeModal('lesson-modal')">Cancel</button>
            <button type="submit" id="save-lesson-btn" class="btn btn-primary">Save Lesson</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/teacher/course-details.js"></script>
  </body>
</html>
