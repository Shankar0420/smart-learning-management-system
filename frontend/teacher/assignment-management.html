<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Management - Teacher Portal</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <div id="sidebar-container"></div>

      <div class="dashboard-main">
        <div id="header-container">
          <span id="page-title-text" class="hidden">Assignment Manager</span>
        </div>

        <main class="dashboard-content">
          <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: 1.5rem;">
            <div>
              <a id="assign-back-link" href="/teacher/courses.html" class="text-muted" style="font-size: 0.85rem;">← Back to Courses</a>
              <h2 id="assign-page-course-title" style="font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-top: 0.25rem;">
                Course Assignments
              </h2>
            </div>

            <button class="btn btn-primary" onclick="openCreateAssignmentModal()">
              + Create Assignment
            </button>
          </div>

          <div id="assign-mgmt-error" class="alert alert-danger hidden"></div>

          <div id="assignments-list-container">
            <div class="loading-container">
              <div class="spinner-primary"></div>
              <p>Loading assignments from MariaDB...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Create / Edit Assignment Modal -->
    <div class="modal-overlay" id="assignment-modal">
      <div class="modal-container" style="max-width: 600px;">
        <div class="modal-header">
          <h3 class="modal-title" id="assignment-modal-title">Create Assignment</h3>
          <button class="modal-close" onclick="window.common.closeModal('assignment-modal')">&times;</button>
        </div>
        <form id="assignment-form">
          <div class="modal-body">
            <!-- Course selector if not pinned to one course -->
            <div class="form-group" id="course-selector-group">
              <label class="form-label required" for="assign-course-select">Select Course</label>
              <select id="assign-course-select" class="form-select" required></select>
            </div>

            <div class="form-group">
              <label class="form-label required" for="assign-title-input">Assignment Title</label>
              <input
                type="text"
                id="assign-title-input"
                class="form-input"
                placeholder="e.g. Lab Assignment 1: Thread Synchronization in Java"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label required" for="assign-desc-input">Description / Problem Statement</label>
              <textarea
                id="assign-desc-input"
                class="form-textarea"
                rows="4"
                placeholder="Enter detailed submission requirements, guidelines, and expected test cases..."
                required
              ></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label class="form-label required" for="assign-deadline-input">Submission Deadline</label>
                <input type="datetime-local" id="assign-deadline-input" class="form-input" required />
              </div>

              <div class="form-group">
                <label class="form-label required" for="assign-marks-input">Maximum Marks</label>
                <input type="number" id="assign-marks-input" class="form-input" min="1" max="1000" value="100" required />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="window.common.closeModal('assignment-modal')">Cancel</button>
            <button type="submit" id="save-assignment-btn" class="btn btn-primary">Save Assignment</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/teacher/assignment-management.js"></script>
  </body>
</html>
