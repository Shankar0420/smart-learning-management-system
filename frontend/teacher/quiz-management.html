<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Management - Teacher Portal</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <div id="sidebar-container"></div>

      <div class="dashboard-main">
        <div id="header-container">
          <span id="page-title-text" class="hidden">Quiz Builder</span>
        </div>

        <main class="dashboard-content">
          <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: 1.5rem;">
            <div>
              <a id="back-to-curriculum" href="/teacher/courses.html" class="text-muted" style="font-size: 0.85rem;">← Back to Course</a>
              <h2 id="quiz-page-course-title" style="font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-top: 0.25rem;">
                Quiz Assessment Management
              </h2>
            </div>

            <button class="btn btn-primary" onclick="openCreateQuizModal()">
              + Create New Quiz
            </button>
          </div>

          <div id="quiz-mgmt-error" class="alert alert-danger hidden"></div>

          <!-- Quizzes List & Question Builder Hub -->
          <div id="quiz-list-container">
            <div class="loading-container">
              <div class="spinner-primary"></div>
              <p>Loading course quizzes from MariaDB...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Create Quiz Modal -->
    <div class="modal-overlay" id="quiz-modal">
      <div class="modal-container">
        <div class="modal-header">
          <h3 class="modal-title" id="quiz-modal-title">Create Quiz</h3>
          <button class="modal-close" onclick="window.common.closeModal('quiz-modal')">&times;</button>
        </div>
        <form id="quiz-form">
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label required" for="quiz-title-input">Quiz Assessment Title</label>
              <input
                type="text"
                id="quiz-title-input"
                class="form-input"
                placeholder="e.g. Midterm Evaluation: Java Collections & Generics"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="window.common.closeModal('quiz-modal')">Cancel</button>
            <button type="submit" id="save-quiz-btn" class="btn btn-primary">Save Quiz</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Add Question Modal with Options and Correct Option -->
    <div class="modal-overlay" id="question-modal">
      <div class="modal-container" style="max-width: 600px;">
        <div class="modal-header">
          <h3 class="modal-title">Add Multiple Choice Question</h3>
          <button class="modal-close" onclick="window.common.closeModal('question-modal')">&times;</button>
        </div>
        <form id="question-form">
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label required" for="q-text-input">Question Statement</label>
              <textarea
                id="q-text-input"
                class="form-textarea"
                rows="3"
                placeholder="e.g. Which Java interface extends Collection and guarantees unique elements?"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label class="form-label required" for="q-marks-input">Marks Allocated</label>
              <input type="number" id="q-marks-input" class="form-input" min="1" max="100" value="1" required />
            </div>

            <div class="form-group">
              <label class="form-label required">Answer Options & Correct Key</label>
              <p class="form-help" style="margin-bottom: 0.75rem;">Enter 4 options and select which one is the correct answer.</p>

              <div style="display: flex; flex-direction: column; gap: 0.5rem;" id="options-inputs-container">
                <div class="flex items-center gap-2">
                  <input type="radio" name="correct-option" value="0" checked title="Mark Option 1 as correct" />
                  <input type="text" class="form-input q-opt-input" placeholder="Option 1 (e.g. java.util.Set)" required />
                </div>
                <div class="flex items-center gap-2">
                  <input type="radio" name="correct-option" value="1" title="Mark Option 2 as correct" />
                  <input type="text" class="form-input q-opt-input" placeholder="Option 2 (e.g. java.util.List)" required />
                </div>
                <div class="flex items-center gap-2">
                  <input type="radio" name="correct-option" value="2" title="Mark Option 3 as correct" />
                  <input type="text" class="form-input q-opt-input" placeholder="Option 3 (e.g. java.util.Map)" required />
                </div>
                <div class="flex items-center gap-2">
                  <input type="radio" name="correct-option" value="3" title="Mark Option 4 as correct" />
                  <input type="text" class="form-input q-opt-input" placeholder="Option 4 (e.g. java.util.Queue)" required />
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="window.common.closeModal('question-modal')">Cancel</button>
            <button type="submit" id="save-question-btn" class="btn btn-primary">Add Question to Quiz</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/teacher/quiz-management.js"></script>
  </body>
</html>
