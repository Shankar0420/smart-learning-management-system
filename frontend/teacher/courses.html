<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Courses - Teacher Portal</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <div id="sidebar-container"></div>

      <div class="dashboard-main">
        <div id="header-container">
          <span id="page-title-text" class="hidden">My Courses</span>
        </div>

        <main class="dashboard-content">
          <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: 2rem;">
            <div>
              <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--dark);">My Teaching Courses</h2>
              <p class="text-muted" style="font-size: 0.875rem;">Manage your course curricula, syllabus modules, and student evaluations</p>
            </div>

            <a href="/teacher/course-form.html" class="btn btn-primary">
              + Create New Course
            </a>
          </div>

          <div id="teacher-courses-error" class="alert alert-danger hidden"></div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Course Offerings</h3>
              <span class="badge badge-info" id="courses-count-badge">0 Courses</span>
            </div>
            <div class="card-body" id="teacher-courses-container" style="padding: 0;">
              <div class="loading-container">
                <div class="spinner-primary"></div>
                <p>Loading your courses from MariaDB...</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/teacher/courses.js"></script>
  </body>
</html>
