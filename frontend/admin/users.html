<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - Admin Portal</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <div id="sidebar-container"></div>

      <div class="dashboard-main">
        <div id="header-container">
          <span id="page-title-text" class="hidden">User Management</span>
        </div>

        <main class="dashboard-content">
          <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: 2rem;">
            <div>
              <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--dark);">University User Accounts</h2>
              <p class="text-muted" style="font-size: 0.875rem;">Manage active faculty and student accounts with MariaDB persistence</p>
            </div>

            <!-- Role Filter Tabs -->
            <div style="background: var(--bg-alt); padding: 0.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); display: flex; gap: 0.25rem;">
              <button id="filter-all" class="btn btn-sm btn-primary">All Users</button>
              <button id="filter-students" class="btn btn-sm btn-secondary">Students</button>
              <button id="filter-teachers" class="btn btn-sm btn-secondary">Teachers</button>
            </div>
          </div>

          <div id="users-error-area" class="alert alert-danger hidden"></div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Registered Accounts</h3>
              <span class="badge badge-info" id="users-count-badge">0 Users</span>
            </div>
            <div class="card-body" id="users-table-container" style="padding: 0;">
              <div class="loading-container">
                <div class="spinner-primary"></div>
                <p>Loading users from MariaDB...</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin/users.js"></script>
  </body>
</html>
