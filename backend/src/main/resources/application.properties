# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Multipart File Limits (PPT/PDF/Assignment uploads)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Security
app.jwt.secret=${JWT_SECRET:25bb53358f5b0802fc764175bf9a54e542f97cbc46581daab084cf439ca6f177}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (Development: localhost and exact Netlify domain)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://smart-learning-management-system.netlify.app}

# Production Error Sanitization
server.error.include-stacktrace=never
server.error.include-message=never

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Admin Registration Security
app.admin.registration-key=${ADMIN_REGISTRATION_KEY:ADMIN_LOCAL_SECRET_KEY_2026}
